[project]
name = "needle-ml"
version = "0.1.0"
description = "Needle ML segment: physics Pc, burn planner, allowed-column tier classifier and artifact builders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
needle-ml = "needle_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/needle_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
