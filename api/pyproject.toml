[project]
name = "needle-api"
version = "0.1.0"
description = "HTTP API for the Needle conjunction triage console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/needle_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
